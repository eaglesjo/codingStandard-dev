name: Validate architecture profiles

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate architecture contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate profiles
        run: python3 scripts/validation/validate_profiles.py

      - name: Test profile contract
        run: python3 -m unittest tests.validation.test_profiles

      - name: Validate multi-agent contract
        run: python3 scripts/validation/validate_agent_contract.py

      - name: Validate multi-agent fixtures
        run: python3 scripts/validation/validate_agent_contract_fixtures.py

      - name: Validate multi-agent E2E simulation
        run: python3 scripts/validation/validate_multi_agent_e2e.py

      - name: Validate AI code quality contract
        run: python3 scripts/validation/validate_ai_code_quality.py

      - name: Test AI code quality contract
        run: python3 tests/validation/test_ai_code_quality.py

      - name: Validate AI evaluation contract
        run: python3 scripts/validation/validate_ai_evaluation.py

      - name: Test AI evaluation contract
        run: python3 tests/validation/test_ai_evaluation.py

      - name: Validate reproducibility contract
        run: python3 scripts/validation/validate_reproducibility.py

      - name: Test reproducibility contract
        run: python3 tests/validation/test_reproducibility.py
