[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-standard-jupyter"
version = "0.1.0"
description = "Jupyter Notebook runtime adapter for AIEngineeringStandard"
requires-python = ">=3.11"
dependencies = ["ipython>=8.0"]

[tool.setuptools]
py-modules = ["aies_jupyter"]
