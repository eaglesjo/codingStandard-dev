name: Promote validated release candidate to public

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact validated codingStandard-dev commit SHA to promote
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    env:
      PUBLIC_REPO: eaglesjo/AIEngineeringStandard
      PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}

    steps:
      - name: Checkout exact validated source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}

      - name: Validate source revision
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ inputs.source_sha }}"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_sha must be a full 40-character commit SHA"
            exit 1
          }
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "$ACTUAL_SHA" == "$SOURCE_SHA" ]] || {
            echo "Checked out SHA $ACTUAL_SHA does not match requested source_sha $SOURCE_SHA"
            exit 1
          }
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "Source SHA is not an ancestor of codingStandard-dev main"
            exit 1
          }

      - name: Re-run release gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip psutil
          python3 scripts/validation/validate.py
          python3 scripts/installers/test_installers.py

      - name: Export public source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/codingStandard-public
          mkdir -p /tmp/codingStandard-public
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='.agents/' \
            --exclude='AGENTS.md' \
            --exclude='docs/development/' \
            ./ /tmp/codingStandard-public/

          mkdir -p /tmp/codingStandard-public/docs/development
          for file in ARCHITECTURE_PROFILES.md POLICY_INHERITANCE.md PROJECT_PROFILES.md SCALABILITY_ARCHITECTURE.md; do
            if [[ -f "docs/development/$file" ]]; then
              cp "docs/development/$file" "/tmp/codingStandard-public/docs/development/$file"
            fi
          done

      - name: Publish validated source to public main
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUBLIC_REPO_TOKEN" || {
            echo "PUBLIC_REPO_TOKEN secret is required in codingStandard-dev"
            exit 1
          }

          git clone "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/${PUBLIC_REPO}.git" /tmp/public-repo
          rsync -a --delete --exclude='.git/' /tmp/codingStandard-public/ /tmp/public-repo/
          cd /tmp/public-repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "Public repository already matches the promoted source."
          else
            git commit -m "promote: validated codingStandard-dev ${{ inputs.source_sha }}"
            git push origin main
          fi

      - name: Report promotion boundary
        shell: bash
        run: |
          echo "Promotion completed for validated source ${{ inputs.source_sha }}."
          echo "No public tag or GitHub Release is created by this workflow."
          echo "Release authorization remains a separate post-promotion audit gate."
